schema: spec-driven
context: |
  Project: 画像生成・画像編集AIの検証リポジトリ
  Goal: 再現可能で安全な実験を高速に回す
  Coding standards:
    - 実行Pythonは3.12系を必須とし、`.python-version` は3.12.xを維持する
    - セットアップ時は `uv run --python 3.12 -- python -V` で3.12.xを確認してから `uv sync` / `uv run` を実行する
    - PythonはPEP 8準拠、型ヒントを必須化し、公開関数にはdocstringを付与
    - 命名規約: 変数・関数はsnake_case、クラスはPascalCase、定数はUPPER_SNAKE_CASE
    - 関数名は動詞で開始し、変数名は役割が判別できる名詞を使う。boolはis_/has_/can_接頭辞を推奨
    - 可能な限り副作用を局所化し、I/O境界を明確化する
    - 実験コードは乱数シード・利用モデル・入力データ・主要パラメータを必ず記録する
    - 画像入出力は形式/色空間/解像度を明示し、暗黙変換を避ける
    - エラーは握りつぶさず、再実行に必要な情報をログへ残す
  Git standards:
    - Conventional Commits形式を必須化 (feat|fix|docs|refactor|test|chore|ci)
    - 1コミット1目的を徹底し、理由を本文に簡潔に記載
    - mainへの直接pushは禁止、Pull Request経由でレビューしてマージ
    - main保護では最低限「PRレビュー必須」「必須status checks」「会話解決」を有効化する
    - 仕様変更はOpenSpec artifacts(proposal/design/tasks/specs)を先に更新
    - 破壊的変更は `!` または `BREAKING CHANGE:` フッターで明示
    - エージェントは作業完了時に自律コミットしてよいが、コミット前に関連テスト/検証を実行し失敗時はコミットしない
    - 自律コミット時は secrets/個人情報の混入を確認し、main以外の作業ブランチへpushした上でPRを作成する
    - 自律PRの本文には実行した検証コマンドと結果を記載し、差分範囲・リスク・ロールバック方針を明示する
    - 自律PR作成に使う認証は最小権限を適用し、原則 `contents:write` と `pull-requests:write` のみ許可する

rules:
  proposal:
    - 目的・非目的・成功指標を明記し、検証対象モデルと評価観点(品質/速度/コスト/安全性)を含める
    - 倫理/安全性リスク(有害生成、著作権、個人情報)と緩和策を記載する
  design:
    - データフロー(入力画像→前処理→生成/編集→後処理→保存)を明記する
    - 再現性要件(シード、モデルバージョン、プロンプト、パラメータ、環境)を定義する
    - 失敗時の扱い(リトライ可否、ログ要件、中断条件)を定義する
  tasks:
    - 実装前にOpenSpec artifacts整合性を確認するタスクを含める
    - 各タスクは検証可能な完了条件を持たせる
    - 影響範囲が大きい変更は、コード変更と評価実験を別タスクに分割する
    - コミットが発生するタスクには、実行した検証コマンドと結果を記録する
  specs:
    - 受け入れ条件は測定可能な形式で記述し、品質・性能・安全性の最低基準を含める
