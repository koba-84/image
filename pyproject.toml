[project]
name = "image-ai"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "accelerate==1.12.0",
    "bitsandbytes==0.49.2 ; platform_machine == 'x86_64' and sys_platform == 'linux'",
    "diffusers==0.36.0",
    "hydra-core==1.3.2",
    "safetensors==0.7.0",
    "torch==2.10.0",
    "torchaudio==2.10.0",
    "torchvision==0.25.0",
    "transformers==5.2.0",
    "xformers==0.0.35 ; platform_machine == 'x86_64' and sys_platform == 'linux'",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

[tool.setuptools.packages.find]
include = ["image_ai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = ["--strict-markers"]
markers = [
    "unit: fast deterministic unit tests",
    "integration: pipeline contract tests",
    "regression: quality and reproducibility regression tests",
    "safety: safety policy regression tests",
]
